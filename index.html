<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1ec">
    <title>HARUNA</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: #1f1f1d;
        background: #f4f1ec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 24px;
      }

      main {
        width: min(100%, 560px);
        text-align: center;
      }

      .brand {
        margin: 0 0 44px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.28em;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 7vw, 42px);
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.04em;
      }

      p {
        margin: 18px 0 0;
        color: #76736e;
        font-size: 15px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">HARUNA</div>
      <h1>페이지를 준비하고 있습니다.</h1>
      <p>곧 이곳에서 만나요.</p>
    </main>
  </body>
</html>
